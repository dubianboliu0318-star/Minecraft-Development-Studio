name: MDS Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run MDS QA
        run: python shared/tools/mds.py qa
      - name: Validate JSON files
        run: python shared/tools/validate_project.py
